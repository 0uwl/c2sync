[project]
name = "c2sync"
version = "0.1.0"
description = "CLI config sync tool for network devices"
authors = [
  { name="0uwl", email="ouwl.person@proton.me" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "netmiko",
  "ciscoconfparse2",
  "paramiko",
  "pytest"
]

[project.scripts]
c2sync = "c2sync.main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"