[project]
name = "c2sync"
version = "0.2.1"
description = "Console Config Sync tool for network devices"
authors = [
  { name="0uwl", email="ouwl.person@proton.me" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "pyserial",
  "pyudev",
  "click",
  "rich",
  "gitpython",
  "ciscoconfparse2"
]

[dependency-groups]
dev = [
  "pytest",
]

[project.scripts]
c2sync = "c2sync.main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"