name: Release

# 'published' rather than 'created' (which also fires for drafts) or 'released'
# (which skips prereleases).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and attach the release archive
    # Keep in step with ci.yml: the runner image sets the glibc floor of the
    # published artifact, so it must not drift between testing and releasing.
    runs-on: ubuntu-24.04
    permissions:
      # Scoped to this job only, and needed solely to upload release assets.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the tagged commit can be checked against main.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # A release can be created from any branch or arbitrary tag. Releases are
      # meant to come from main, so a tag pointing somewhere else must not be
      # published as though it were a main build.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::Tag ${TAG} (${GITHUB_SHA}) is not an ancestor of main."
            echo "Releases must be cut from a commit that has landed on main."
            exit 1
          fi
          echo "${GITHUB_SHA} is contained in main."
        env:
          TAG: ${{ github.event.release.tag_name }}

      # build.sh names the artifact from pyproject.toml, with no knowledge of
      # the git tag. Without this check, releasing v0.2.0 while pyproject.toml
      # still says 0.1.0 silently attaches c2sync-0.1.0-* to the v0.2.0 release.
      - name: Verify the tag matches pyproject.toml
        run: |
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${TAG#v}"
          if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${PROJECT_VERSION}."
            echo "Bump the version on main first, then cut the release."
            exit 1
          fi
          echo "Tag ${TAG} matches pyproject.toml version ${PROJECT_VERSION}."
        env:
          TAG: ${{ github.event.release.tag_name }}

      # build.sh --test-install runs the suite, so pytest and the runtime
      # dependencies have to be present; without this the build aborts with
      # "pytest not found".
      - name: Install
        run: python -m pip install -e ".[dev]"

      # Tests included: CI ran on this commit, but an artifact that gets
      # published to users is never built from an untested tree.
      - name: Build and install-test
        run: ./build.sh --test-install

      # The SHA256SUMS inside the archive covers the bundled wheels, so it
      # cannot help anyone verify the download itself. This one can.
      - name: Checksum the archive
        working-directory: dist
        run: |
          sha256sum c2sync-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --clobber so re-running the workflow on the same release replaces the
      # assets instead of failing on the ones already there.
      - name: Attach assets to the release
        run: gh release upload "${TAG}" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
